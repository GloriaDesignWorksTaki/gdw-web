# ロリポップ！レンタルサーバーへの自動デプロイ（GitHub Actions）
# rsync は burnett アクションではなく run で実行（switches のスペース分割を避ける）

name: Deploy to Lolipop

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-lolipop
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy (rsync over SSH)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          printf '\n' >> ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 2222 "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          RSYNC_RSH="ssh -i ~/.ssh/deploy_key -p 2222 -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes"
          rsync -avzr --delete \
            --exclude-from=deploy/rsync-exclude.txt \
            --filter="merge deploy/rsync-filter.txt" \
            -e "$RSYNC_RSH" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Composer install on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 2222
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            # ロリポップ: php は /usr/local/php/VERSION/bin/php。PATH に無いと /usr/bin/env php が失敗する
            # PHP 8.4 + サーバー同梱の古い composer は array_merge で落ちるため、8.3 → 8.2… を優先
            PHP_BIN=""
            for v in 8.3 8.2 8.1 8.0 7.4 7.3; do
              f="/usr/local/php/$v/bin/php"
              if [ -x "$f" ]; then
                PHP_BIN="$f"
                break
              fi
            done
            if [ -z "$PHP_BIN" ]; then
              for f in /usr/local/php/*/bin/php; do
                [ -x "$f" ] && PHP_BIN="$f"
              done
            fi
            if [ -z "$PHP_BIN" ]; then
              echo "php が見つかりません。/usr/local/php を確認してください。"
              ls -la /usr/local/php/ 2>/dev/null || true
              exit 1
            fi
            echo "Using: $PHP_BIN"
            "$PHP_BIN" -v
            if [ -x /usr/local/bin/composer ]; then
              "$PHP_BIN" /usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction
            elif command -v composer >/dev/null 2>&1; then
              "$PHP_BIN" "$(command -v composer)" install --no-dev --optimize-autoloader --no-interaction
            elif [ -f composer.phar ]; then
              "$PHP_BIN" composer.phar install --no-dev --optimize-autoloader --no-interaction
            else
              echo "composer が見つかりません。"
              exit 1
            fi
