# ロリポップ！レンタルサーバーへの自動デプロイ（GitHub Actions）
# rsync は burnett アクションではなく run で実行（switches のスペース分割を避ける）

name: Deploy to Lolipop

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-lolipop
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy (rsync over SSH)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 2222 "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          rsync -avzr --delete \
            --exclude-from=deploy/rsync-exclude.txt \
            --filter="merge deploy/rsync-filter.txt" \
            -e "ssh -i ~/.ssh/deploy_key -p 2222 -o StrictHostKeyChecking=accept-new" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Composer install on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 2222
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            if command -v composer >/dev/null 2>&1; then
              composer install --no-dev --optimize-autoloader --no-interaction
            elif [ -f composer.phar ]; then
              php composer.phar install --no-dev --optimize-autoloader --no-interaction
            else
              echo "composer が見つかりません。ロリポップのマニュアルに沿いパスを確認してください。"
              exit 1
            fi
